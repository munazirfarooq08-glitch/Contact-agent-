name: Pull Instagram Data

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  pull-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run data pull script
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          MY_INSTAGRAM_HANDLE: ${{ secrets.MY_INSTAGRAM_HANDLE }}
          COMPETITOR_HANDLES: ${{ secrets.COMPETITOR_HANDLES }}
        run: python scripts/pull_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json
          git commit -m "Update Instagram data" || echo "No changes to commit"
          git push
